plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

evaluationDependsOn(':core')

base {
    archivesName = "${project.archives_base_name}-neoforge-1.21.1"
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

neoForge {
    version = project.neoforge_version

    parchment {
        mappingsVersion = project.parchment_mappings
        minecraftVersion = project.parchment_minecraft
    }

    runs {
        client { client() }
        server { server() }
    }

    mods {
        "fiw_mods_api" {
            sourceSet sourceSets.main
            sourceSet project(':core').sourceSets.main
        }
    }
}

dependencies {
    // Pure-Java engine: compiled against and merged into the jar below.
    implementation project(':core')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}

jar {
    from project(':core').sourceSets.main.output
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.archives_base_name}" }
    }
}
