name: Release

# Recovery path: rebuilds, re-verifies and (re)publishes one version. Normal releases happen
# in Auto release when a new version lands on main; use this only when that run failed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag or version to publish, for example v1.2.0 or 1.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the requested version
        id: version
        env:
          REQUESTED: ${{ inputs.tag || github.ref_name }}
        run: bash .github/scripts/resolve-release.sh

  # Same build and per-target gameplay checks as every push.
  build:
    needs: resolve
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}

  publish:
    name: Publish to Modrinth and GitHub
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: jars
          path: release

      - name: Publish the verified version
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: bash .github/scripts/publish-release.sh recover
