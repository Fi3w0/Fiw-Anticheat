name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install both JDKs. Loom requires the Gradle daemon to run on Java 21 for
      # the 1.21.x targets; the 1.20.1 targets compile against Java 17 via Gradle
      # toolchains (auto-detected from the installed JDKs).
      - name: Set up JDK 17 + 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build all targets + run core tests
        run: ./gradlew build --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}

      - name: Upload built jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fiw-anticheat-jars
          path: '**/build/libs/*.jar'
          if-no-files-found: warn