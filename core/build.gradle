plugins {
    id 'java-library'
}

base {
    archivesName = "${project.archives_base_name}-core"
}

repositories {
    mavenCentral()
}

java {
    // Java 17 = lowest common denominator (Fabric 1.20.1 = 17, NeoForge 1.21.1 = 21).
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    // Gson is provided by Minecraft at runtime, so it is compile-only here and
    // only pulled in for tests. It must NOT be shaded into the loader jars.
    compileOnly 'com.google.code.gson:gson:2.10.1'

    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
